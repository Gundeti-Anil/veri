[profile.default]
src            = "src"
out            = "out"
libs           = ["lib"]
test           = "test"
script         = "script"
solc           = "0.8.24"
optimizer      = true
optimizer_runs = 200
via_ir         = true

remappings = [
  "@ensdomains/contracts-v2/=lib/contracts-v2/contracts/src/",
  "@openzeppelin/contracts/=lib/contracts-v2/contracts/lib/openzeppelin-contracts/contracts/",
  "@ens/contracts/=lib/contracts-v2/contracts/lib/ens-contracts/contracts/",
]

[rpc_endpoints]
sepolia = "${RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.etherscan.io/api" }
