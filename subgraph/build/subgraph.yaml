specVersion: 0.0.5
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: VeriRegistrar
    network: sepolia
    source:
      address: "0xAC8AB3B8467E1EcB67F61c6035135606959a2f77"
      abi: VeriRegistrar
      startBlock: 11676198
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: VeriRegistrar/VeriRegistrar.wasm
      entities:
        - Human
        - Agent
        - Capability
        - CapabilityEvent
        - Protocol
        - TokenToLabel
      abis:
        - name: VeriRegistrar
          file: VeriRegistrar/VeriRegistrar.json
      eventHandlers:
        - event: AgentIssued(indexed bytes32,string,indexed bytes32,indexed address,uint256,uint64)
          handler: handleAgentIssued
        - event: CapabilityGranted(indexed bytes32,indexed bytes32,uint256)
          handler: handleCapabilityGranted
        - event: CapabilityRevoked(indexed bytes32,indexed bytes32,string)
          handler: handleCapabilityRevoked
        - event: AgentRetired(indexed bytes32,indexed bytes32)
          handler: handleAgentRetired
  - kind: ethereum
    name: UserRegistry
    network: sepolia
    source:
      address: "0x37510f2302B5CdDaf8550c5FBe162D815F761c3F"
      abi: UserRegistry
      startBlock: 11676037
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: VeriRegistrar/VeriRegistrar.wasm
      entities:
        - Agent
        - TokenToLabel
      abis:
        - name: UserRegistry
          file: UserRegistry/UserRegistry.json
      eventHandlers:
        - event: TokenRegenerated(indexed uint256,indexed uint256)
          handler: onTokenRegenerated
        - event: ExpiryUpdated(indexed uint256,indexed uint64,indexed address)
          handler: handleExpiryUpdated
