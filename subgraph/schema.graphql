# ─────────────────────────────────────────────────────────────────────────────
# Veri Subgraph Schema
#
# Privacy rule: humanId = keccak256(nullifier) — the raw nullifier is NEVER
# stored here. It stays in the backend database.
#
# Key rule: all Agent entities are keyed on labelHash (bytes32), NEVER on
# tokenId. Token IDs are mutable in ENSv2 (they change on every role grant
# or revoke). The subgraph follows TokenRegenerated events to keep
# Agent.currentTokenId current for display, but it is never used as a key.
# ─────────────────────────────────────────────────────────────────────────────

type Human @entity(immutable: false) {
  "humanId = keccak256(abi.encode(nullifier)). Never the raw nullifier."
  id: Bytes!

  "Number of currently registered (non-retired) agents."
  agentCount: Int!

  agents: [Agent!]! @derivedFrom(field: "human")

  "Block timestamp of this human's first agent issuance."
  firstSeenAt: BigInt!
}

type Agent @entity(immutable: false) {
  "labelHash = keccak256(bytes(label)). Key — never the tokenId."
  id: Bytes!

  "Leaf label (e.g. 'scanner')."
  label: String!

  "Full ENS name (e.g. 'scanner.veri.eth')."
  name: String!

  human: Human!

  "Address that holds the ENSv2 ERC-1155 name token."
  agentAddress: Bytes!

  "Current ENSv2 token ID — updated on TokenRegenerated. Display-only, do not key on this."
  currentTokenId: BigInt!

  "Absolute Unix timestamp of name expiry."
  expiry: BigInt!

  "False after AgentRetired is emitted."
  active: Boolean!

  "Content of the agent-context text record (ENSIP-26)."
  context: String

  "Content of the agent-endpoint[mcp] text record (ENSIP-26)."
  mcpEndpoint: String

  capabilities: [Capability!]! @derivedFrom(field: "agent")
  events:       [CapabilityEvent!]! @derivedFrom(field: "agent")

  issuedAt: BigInt!
  issuedTx: Bytes!
}

type Capability @entity(immutable: false) {
  "labelHash-capabilityId (hex, hyphen-separated)."
  id: ID!

  agent: Agent!

  capabilityId: Bytes!

  "Human-readable capability name resolved in the mapping."
  name: String!

  "True while the capability is currently granted."
  granted: Boolean!

  "Resolver EAC role bitmap associated with this capability."
  roleBitmap: BigInt!

  grantedAt: BigInt!

  "Null until revoked."
  revokedAt: BigInt

  revokeReason: String
}

type CapabilityEvent @entity(immutable: true) {
  "txHash-logIndex, encoded as Bytes."
  id: Bytes!

  agent: Agent!

  capabilityId: Bytes!

  "'GRANTED' or 'REVOKED'."
  action: String!

  "Populated for REVOKED events."
  reason: String

  blockNumber: BigInt!
  timestamp:   BigInt!
  txHash:      Bytes!
}

type Protocol @entity(immutable: false) {
  "'veri' — singleton."
  id: ID!

  totalHumans:      Int!
  totalAgents:      Int!
  activeAgents:     Int!
  totalRevocations: Int!
}

# ─────────────────────────────────────────────────────────────────────────────
# Internal helper — maps current ENSv2 tokenId back to labelHash so that
# UserRegistry events (TokenRegenerated, ExpiryUpdated) can find the right Agent.
# Not surfaced in the MCP query layer.
# ─────────────────────────────────────────────────────────────────────────────
type TokenToLabel @entity(immutable: false) {
  "Token ID as decimal string."
  id: ID!

  labelHash: Bytes!
}
